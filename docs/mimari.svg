<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1020" width="1120" height="1020" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">

  <rect width="1120" height="1020" fill="#ffffff"/>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3d4753"/>
    </marker>
    <marker id="arL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b939e"/>
    </marker>
  </defs>

  <text x="44" y="54" font-size="26" font-weight="700" fill="#0d1116">Proofline — Mimari</text>
  <text x="44" y="82" font-size="14.5" font-weight="500" fill="#5b6470">Kurum–girişim iş birliğinin ihtiyaçtan sonuca kadar tek zincirde yönetimi</text>


  <!-- ══════ ZİNCİR ══════ -->
  <text x="44" y="140" font-size="13" font-weight="700" fill="#7c8592" letter-spacing="1.2">ZİNCİR</text>

  <rect x="44" y="162" width="134" height="60" rx="9" fill="#eef2f7" stroke="#aab4c0" stroke-width="1.6"/>
  <text x="111" y="188" font-size="16" font-weight="700" fill="#0d1116" text-anchor="middle">İhtiyaç</text>
  <text x="111" y="208" font-size="12" font-weight="500" fill="#5b6470" text-anchor="middle">9 alanlı kanvas</text>

  <rect x="216" y="162" width="134" height="60" rx="9" fill="#eef2f7" stroke="#aab4c0" stroke-width="1.6"/>
  <text x="283" y="188" font-size="16" font-weight="700" fill="#0d1116" text-anchor="middle">Hazırlık</text>
  <text x="283" y="208" font-size="12" font-weight="500" fill="#5b6470" text-anchor="middle">beyan + ölçüm</text>

  <rect x="388" y="124" width="134" height="54" rx="9" fill="#f7f9fc" stroke="#c3cbd6" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="455" y="148" font-size="15" font-weight="700" fill="#0d1116" text-anchor="middle">Vaka</text>
  <text x="455" y="166" font-size="12" font-weight="500" fill="#5b6470" text-anchor="middle">opsiyonel · max 4 saat</text>

  <rect x="388" y="206" width="134" height="54" rx="9" fill="#f7f9fc" stroke="#c3cbd6" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="455" y="230" font-size="15" font-weight="700" fill="#0d1116" text-anchor="middle">Doğrudan</text>
  <text x="455" y="248" font-size="12" font-weight="500" fill="#5b6470" text-anchor="middle">olgun girişim</text>

  <rect x="560" y="162" width="134" height="60" rx="9" fill="#eef2f7" stroke="#aab4c0" stroke-width="1.6"/>
  <text x="627" y="188" font-size="16" font-weight="700" fill="#0d1116" text-anchor="middle">POC</text>
  <text x="627" y="208" font-size="12" font-weight="500" fill="#5b6470" text-anchor="middle">vade + çift onay</text>

  <rect x="732" y="162" width="134" height="60" rx="9" fill="#eef2f7" stroke="#aab4c0" stroke-width="1.6"/>
  <text x="799" y="188" font-size="16" font-weight="700" fill="#0d1116" text-anchor="middle">Sonuç</text>
  <text x="799" y="208" font-size="12" font-weight="500" fill="#5b6470" text-anchor="middle">kapanış nedeni</text>

  <rect x="904" y="162" width="134" height="60" rx="9" fill="#e3eaf2" stroke="#8b97a6" stroke-width="1.6"/>
  <text x="971" y="188" font-size="16" font-weight="700" fill="#0d1116" text-anchor="middle">Pano</text>
  <text x="971" y="208" font-size="12" font-weight="500" fill="#5b6470" text-anchor="middle">KPI + rapor</text>

  <line x1="178" y1="192" x2="210" y2="192" stroke="#3d4753" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M 350 192 L 369 192 L 369 151 L 382 151" stroke="#3d4753" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M 350 192 L 369 192 L 369 233 L 382 233" stroke="#3d4753" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M 522 151 L 541 151 L 541 192 L 554 192" stroke="#3d4753" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M 522 233 L 541 233 L 541 192 L 554 192" stroke="#3d4753" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <line x1="694" y1="192" x2="726" y2="192" stroke="#3d4753" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="866" y1="192" x2="898" y2="192" stroke="#3d4753" stroke-width="2" marker-end="url(#ar)"/>

  <text x="44" y="298" font-size="12.5" font-weight="500" fill="#5b6470">Olgunluk eşiği aşılmadan ihtiyaç yayımlanamaz. Kilometre taşları iki taraf da onaylamadan kapanmaz.</text>


  <!-- ══════ HAZIRLIK PANELİ ══════ -->
  <text x="44" y="356" font-size="13" font-weight="700" fill="#7c8592" letter-spacing="1.2">HAZIRLIK PANELİ</text>

  <rect x="44" y="378" width="256" height="164" rx="9" fill="#fbfcfd" stroke="#c3cbd6" stroke-width="1.6"/>
  <text x="66" y="406" font-size="15" font-weight="700" fill="#0d1116">Beyan</text>
  <text x="66" y="426" font-size="12" font-weight="500" fill="#7c8592">kurum kendisi işaretler</text>
  <line x1="66" y1="440" x2="278" y2="440" stroke="#e2e7ed" stroke-width="1.4"/>
  <text x="66" y="462" font-size="12.5" font-weight="500" fill="#3d4753">Sponsor var</text>
  <text x="66" y="484" font-size="12.5" font-weight="500" fill="#3d4753">Bütçe onaylı</text>
  <text x="66" y="506" font-size="12.5" font-weight="500" fill="#3d4753">Veri erişimi hazır</text>
  <text x="66" y="530" font-size="11.5" font-weight="700" fill="#9aa3ae">Değiştirilebilir</text>

  <rect x="322" y="378" width="256" height="164" rx="9" fill="#f2faf6" stroke="#1a7f52" stroke-width="2"/>
  <text x="344" y="406" font-size="15" font-weight="700" fill="#0d1116">Ölçüm</text>
  <text x="344" y="426" font-size="12" font-weight="500" fill="#1a7f52">olay günlüğünden hesaplanır</text>
  <line x1="344" y1="440" x2="556" y2="440" stroke="#c9e5d7" stroke-width="1.4"/>
  <text x="344" y="462" font-size="12.5" font-weight="500" fill="#3d4753">Ortalama yanıt süresi</text>
  <text x="344" y="484" font-size="12.5" font-weight="500" fill="#3d4753">Değerlendirme süresi</text>
  <text x="344" y="506" font-size="12.5" font-weight="500" fill="#3d4753">Taahhüt uyumu</text>
  <text x="344" y="530" font-size="11.5" font-weight="700" fill="#1a7f52">Sahtelenemez</text>

  <text x="44" y="572" font-size="12.5" font-weight="500" fill="#5b6470">Metrikler tüzel kişi düzeyindedir; gerçek kişi puanlanmaz veya profillenmez.</text>
  <text x="44" y="592" font-size="12.5" font-weight="500" fill="#5b6470">Ölçüm, kurumun kendi girdiği taahhüde göre yapılır. Girişim tarafında simetrik işler.</text>


  <!-- ══════ DURUM MAKİNESİ ══════ -->
  <text x="620" y="356" font-size="13" font-weight="700" fill="#7c8592" letter-spacing="1.2">DURUM MAKİNESİ</text>

  <rect x="620" y="378" width="456" height="164" rx="9" fill="#fbfcfd" stroke="#c3cbd6" stroke-width="1.6"/>

  <text x="642" y="406" font-size="13.5" font-weight="700" fill="#3d4753">İhtiyaç</text>
  <text x="642" y="430" font-size="12.5" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0d1116">TASLAK → HAZIR → YAYIMDA → KAPALI</text>
  <text x="642" y="450" font-size="12" font-weight="500" fill="#1a7f52">olgunluk eşiği aşılmadan HAZIR olmaz</text>

  <line x1="642" y1="466" x2="1054" y2="466" stroke="#e2e7ed" stroke-width="1.4"/>

  <text x="642" y="490" font-size="13.5" font-weight="700" fill="#3d4753">Pilot</text>
  <text x="642" y="514" font-size="12.5" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0d1116">AÇIK → AKTİF → KARAR_BEKLİYOR → ÖLÇEKLE | DURDU</text>
  <text x="642" y="534" font-size="12" font-weight="500" fill="#1a7f52">vade dolunca otomatik geçiş · yanıtsızlık DURDU sayılır</text>

  <text x="620" y="572" font-size="12.5" font-weight="500" fill="#5b6470">Aşama tanımları ve geçiş koşulları yapılandırma dosyasındadır, koda gömülü değildir.</text>
  <text x="620" y="592" font-size="12.5" font-weight="500" fill="#5b6470">Farklı bir program kendi akışını, eşiklerini ve KPI tanımlarını girebilir.</text>


  <!-- ══════ YAPAY ZEKA ══════ -->
  <text x="44" y="652" font-size="13" font-weight="700" fill="#7c8592" letter-spacing="1.2">YAPAY ZEKA KATMANI</text>

  <rect x="44" y="674" width="1032" height="96" rx="9" fill="#fbfcfd" stroke="#c3cbd6" stroke-width="1.6"/>
  <text x="66" y="704" font-size="15" font-weight="700" fill="#0d1116">Makine hazırlar · İnsan karar verir · Her şey kaydedilir</text>
  <text x="66" y="728" font-size="12.5" font-weight="500" fill="#3d4753">Her aşamada yardımcı: olgunluk eleştirisi · benzer vaka uyarısı · vaka taslağı · kilometre taşı taslağı · risk uyarısı · rapor özeti</text>
  <text x="66" y="752" font-size="12.5" font-weight="600" fill="#1a7f52">Yapmadıkları: uyum skoru · sıralama · otomatik eleme · kişi puanlama · onaysız alan doldurma</text>


  <!-- ══════ VERİ MODELİ ══════ -->
  <text x="44" y="822" font-size="13" font-weight="700" fill="#7c8592" letter-spacing="1.2">VERİ MODELİ</text>

  <rect x="44" y="844" width="152" height="48" rx="8" fill="#f7f9fc" stroke="#c3cbd6" stroke-width="1.6"/>
  <text x="120" y="874" font-size="14" font-weight="600" fill="#0d1116" text-anchor="middle">Kurum</text>

  <rect x="218" y="844" width="152" height="48" rx="8" fill="#f7f9fc" stroke="#c3cbd6" stroke-width="1.6"/>
  <text x="294" y="874" font-size="14" font-weight="600" fill="#0d1116" text-anchor="middle">İhtiyaç</text>

  <rect x="392" y="844" width="152" height="48" rx="8" fill="#f7f9fc" stroke="#c3cbd6" stroke-width="1.6"/>
  <text x="468" y="874" font-size="14" font-weight="600" fill="#0d1116" text-anchor="middle">Vaka</text>

  <rect x="566" y="844" width="152" height="48" rx="8" fill="#f7f9fc" stroke="#c3cbd6" stroke-width="1.6"/>
  <text x="642" y="874" font-size="14" font-weight="600" fill="#0d1116" text-anchor="middle">Pilot</text>

  <rect x="740" y="844" width="164" height="48" rx="8" fill="#f7f9fc" stroke="#c3cbd6" stroke-width="1.6"/>
  <text x="822" y="874" font-size="14" font-weight="600" fill="#0d1116" text-anchor="middle">KilometreTaşı</text>

  <rect x="924" y="844" width="152" height="48" rx="8" fill="#f7f9fc" stroke="#c3cbd6" stroke-width="1.6"/>
  <text x="1000" y="874" font-size="14" font-weight="600" fill="#0d1116" text-anchor="middle">Taahhüt</text>

  <line x1="196" y1="868" x2="212" y2="868" stroke="#8b939e" stroke-width="1.6" marker-end="url(#arL)"/>
  <line x1="370" y1="868" x2="386" y2="868" stroke="#8b939e" stroke-width="1.6" marker-end="url(#arL)"/>
  <line x1="544" y1="868" x2="560" y2="868" stroke="#8b939e" stroke-width="1.6" marker-end="url(#arL)"/>
  <line x1="718" y1="868" x2="734" y2="868" stroke="#8b939e" stroke-width="1.6" marker-end="url(#arL)"/>

  <text x="44" y="922" font-size="12.5" font-weight="500" fill="#5b6470">Kişisel veriler ayrı kayıtta tutulur; olay günlüğüne takma ad referansıyla bağlanır — silme talebi zinciri bozmaz.</text>


  <!-- ══════ OLAY GÜNLÜĞÜ ══════ -->
  <rect x="44" y="944" width="1032" height="56" rx="9" fill="#0f3d2a"/>
  <text x="66" y="970" font-size="15" font-weight="700" fill="#ffffff">Olay Günlüğü</text>
  <text x="66" y="990" font-size="12.5" font-weight="500" fill="#a8d5bd">Ekleme-esaslı · geriye dönük değiştirilemez · düzeltme yeni bir olay olarak yazılır</text>
  <text x="1054" y="970" font-size="13" font-weight="700" fill="#ffffff" text-anchor="end">Tüm metrikler buradan türetilir</text>
  <text x="1054" y="990" font-size="12.5" font-weight="500" fill="#a8d5bd" text-anchor="end">Kullanıcı hiçbir metriği elle giremez</text>

</svg>
